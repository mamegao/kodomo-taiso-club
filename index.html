<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>こども体操クラブ資料ポータル</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Zen Maru Gothic",sans-serif;
    background:linear-gradient(180deg,#fffdf7,#eef8ff);
    color:#444;
}

header{
    background:linear-gradient(
        135deg,
        #71beff,
        #8fd3ff
    );
    color:white;
    text-align:center;
    padding:60px 20px;
    border-bottom-left-radius:40px;
    border-bottom-right-radius:40px;
    box-shadow:0 6px 20px rgba(0,0,0,.1);
}

header h1{
    margin:0;
    font-size:2.2rem;
}

.subtitle{
    margin-top:15px;
    font-size:1.1rem;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:white;
    border-radius:24px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:0.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.card h2{
    margin-top:0;
    color:#3578d6;
}

.card p{
    line-height:1.8;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 22px;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.btn:hover{
    background:#2f7ad3;
}

.info{
    background:#fff5c9;
    border-left:6px solid #ffd54f;
    border-radius:18px;
    padding:22px;
    line-height:1.8;
}

footer{
    text-align:center;
    color:#888;
    padding:40px 20px;
}

@media (max-width:600px){

    header h1{
        font-size:1.7rem;
    }

    .card{
        padding:22px;
    }

    .btn{
        display:block;
        text-align:center;
    }
}

</style>
</head>

<body>

<header>
    <h1>🤸 こども体操クラブ資料ポータル 🤸</h1>

    <div class="subtitle">
        施設予約に関する資料をまとめています
    </div>
</header>

<div class="container">

    <div class="card">
        <h2>📖 施設予約について</h2>

        <p>
            施設予約の流れ、担当期間、
            支払い方法などをまとめた説明資料です。
        </p>
<a href="施設予約について.html" class="btn">
                   マニュアルを見る
        </a>
    </div>

    <div class="card">
        <h2>📱 かんたん予約操作</h2>

        <p>
            実際の画面を見ながら予約方法を確認できます。
            初めて担当される方はこちらもご覧ください。
        </p>
<a href="かんたん予約操作.html" class="btn">
                    操作手順を見る
        </a>
    </div>

    <div class="info">
        <strong>💡 はじめての方へ</strong>
        <br><br>

        ① 「施設予約について」を読んで全体像を確認
        <br>
        ↓
        <br>
        ② 「かんたん予約操作」で実際の予約方法を確認
        <br>
        ↓
        <br>
        ③ 施設予約を実施
    </div>

</div>

<footer>
    © こども体操クラブ
</footer>

</body>
</html>
